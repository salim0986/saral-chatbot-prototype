services:
  qdrant:
    image: qdrant/qdrant:v1.13.3
    container_name: saral_qdrant
    ports:
      - "6333:6333"   # HTTP API + Web UI
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saral_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - backend_data:/app/data   # SQLite persistence
      - ./backend/app:/app/app   # Hot-reload in dev
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saral_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  qdrant_data:
  backend_data:
